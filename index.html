const SEC=[
{id:"m1",t:"ಮನೋವಿಜ್ಞಾನ – ಪರಿಚಯ",p:"1–3",src:[
"ಪ್ರಾರಂಭದಲ್ಲಿ ಮನೋವಿಜ್ಞಾನವನ್ನು “ತತ್ವಶಾಸ್ತ್ರದ” ಒಂದು ಭಾಗವಾಗಿ ಅಧ್ಯಯನ ಮಾಡಲಾಗುತ್ತಿತ್ತು. ತತ್ವಶಾಸ್ತ್ರ (Philosophy) ಎಂದರೆ ಜ್ಞಾನದ ಬಗೆಗಿನ ಅನುರಾಗ ಅಥವಾ ಪ್ರೀತಿಯ ಬಗೆಗಿನ ಅನುರಾಗ. (p1, p2)",
"1590 ರಲ್ಲಿ ಮೊದಲ ಬಾರಿಗೆ ರುಡಾಲ್ಫ್ ಗೆಕ್ಲೆಯವರು ಮನೋವಿಜ್ಞಾನ ಎಂಬ ಪದವನ್ನು ಬಳಸಿದರು. (p1)",
"ಮನೋವಿಜ್ಞಾನದ ಪಿತಾಮಹ: “ಸಿಗ್ಮಂಡ್ ಫ್ರಾಯ್ಡ್” (ಮೂಲದಲ್ಲಿ ಇದ್ದಂತೆ). (p1)",
"Psychology ⇒ psyche = ಆತ್ಮ (soul), logos = ಅಧ್ಯಯನ (study). ಅರ್ಥ: “ಆತ್ಮದ ಅಧ್ಯಯನ”. (p1)",
"ಆತ್ಮದ ಅಧ್ಯಯನ ⇒ ಅರಿಸ್ಟಾಟಲ್, ಸಾಕ್ರೆಟಸ್, ಪ್ಲೇಟೋ. ಮನಸ್ಸಿನ ಅಧ್ಯಯನ ⇒ ಕಾಂಟ್, ಲಾಕೆ, ಲೈಬ್ನಿಜ್. ಪ್ರಜ್ಞಾನುಭವಗಳ ಅಧ್ಯಯನ ⇒ ವಿಲಿಯಂ ಜೇಮ್ಸ್, ಇ.ಬಿ. ಟಿಚ್ನರ್, ವಿಲ್‌ಹೆಲ್ಮ್ ವೂಂಟ್ (ಪ್ರಜ್ಞಾವಸ್ಥೆ, ಅರೆ ಪ್ರಜ್ಞಾವಸ್ಥೆ, ಸುಪ್ತ ಪ್ರಜ್ಞಾವಸ್ಥೆ). (p1)",
"ವರ್ತನೆಯ ಅಧ್ಯಯನ ⇒ ಮೊದಲ ಬಾರಿಗೆ ವರ್ತನೆಯೆಂಬ ಪದ ಬಳಸಿದವರು ಮ್ಯಾಕ್ ಡೂಗಲ್ (1908). (1913) ಜೆ.ಬಿ. ವಾಟ್ಸನ್ ⇒ ಆಲ್ಬರ್ಟ್ (11 month 3 day) ಎಂಬ ಮಗುವಿನ ಮೇಲೆ ಮಾಡಿದ ಪ್ರಯೋಗ ವಿವಾದಾತ್ಮಕವಾಗಿದೆ. (p1)",
"ಆಧುನಿಕ ವ್ಯಾಖ್ಯೆ: ಮಾನವನ ವರ್ತನೆ ಮತ್ತು ಮಾನಸಿಕ ಕ್ರಿಯೆಗಳ ಅಧ್ಯಯನ ಮಾಡುವ ಪ್ರಕ್ರಿಯೆಯಾಗಿದೆ ⇒ ಪೆಲ್ಲಮನ್. (p1)",
"ಮನೋವಿಜ್ಞಾನವು ಮೊದಲು ತನ್ನ ಆತ್ಮವನ್ನು ಕಳೆದುಕೊಂಡಿತು, ನಂತರ ಮನಸ್ಸನ್ನು, ತದನಂತರದಲ್ಲಿ ಪ್ರಜ್ಞೆಯನ್ನು ಕಳೆದುಕೊಂಡು ಕೊನೆಯದಾಗಿ ವರ್ತನೆಯನ್ನು ಉಳಿಸಿಕೊಂಡಿದೆ ಎಂದು “ವುಡ್ ವರ್ತ್” ಹೇಳಿದರು (1945). (p2)",
"ಮಾನವನ ವರ್ತನೆ ಮತ್ತು ಮಾನವನ ಅಂತರ ಸಂಬಂಧಗಳ ವೈಜ್ಞಾನಿಕ ಅಧ್ಯಯನ → “ಕ್ರೋ ಕ್ರೋ”. “ಧನಾತ್ಮಕ ವಿಜ್ಞಾನವಾಗಿದೆ” → “ವ್ಯಾಟ್ಸನ್”. ಮನೋವಿಜ್ಞಾನದ ವ್ಯಾಪ್ತಿ ದೊಡ್ಡದು, ಆದರೆ ಅದರ ಇತಿಹಾಸ ಚಿಕ್ಕದು → “ಎಬ್ಬಿಂಗ್ಹಾಸ್”. (p2)",
"ಗುರಿಗಳು (Aims): a) ವರ್ಣನೆ (description) b) ವಿವರಣೆ (explanation) c) ಪ್ರಾಗುಪ್ತಿ (predict) d) ನಿಯಂತ್ರಣ (control) e) ಅನ್ವಯ ಮತ್ತು ಸುಧಾರಣೆ (application). (p2)",
"ಅಪಸಾಮಾನ್ಯ ಮನೋವಿಜ್ಞಾನ: a) ಮನೋ ಬೇನೆಗಳು – ದೈನಂದಿನ ಸಮಸ್ಯೆಗಳನ್ನು ನಿಭಾಯಿಸಲಾರರು. b) ಮನೋ ವಿಕೃತಿಗಳು – ವಾಸ್ತವಿಕತೆಯ ಜೊತೆ ಸಂಬಂಧ ಕಳೆದುಕೊಳ್ಳುವವರು; “Schizophrenia”. c) ಮನೋ ದೈಹಿಕ ಬೇನೆಗಳು – ಮಾನಸಿಕ ಅಂಶಗಳು ದೈಹಿಕ ಆರೋಗ್ಯದ ಮೇಲೆ ಮಾಡುವ ದುಷ್ಪರಿಣಾಮ. (p2)"],
add:"ಈ ಪಾಠದ ಮುಖ್ಯ ಸೂತ್ರ: ಆತ್ಮ → ಮನಸ್ಸು → ಪ್ರಜ್ಞೆ → ವರ್ತನೆ. ಇದು ಮನೋವಿಜ್ಞಾನದ ವಿಷಯವಸ್ತು ಬದಲಾದ ಕ್ರಮ."},
{id:"m2",t:"ಇತಿಹಾಸ – ವರ್ಷಗಳು ಮತ್ತು ವ್ಯಕ್ತಿಗಳು",p:"3",src:[
"1879: ಜರ್ಮನಿನ ಲೀಪ್‌ಜಿಗ್‌ನಲ್ಲಿ ಮೊದಲ ಮನೋವಿಜ್ಞಾನದ ಪ್ರಯೋಗಾಲಯವನ್ನು ವಿಲ್‌ಹೆಲ್ಮ್ ವೂಂಟ್ ಸ್ಥಾಪನೆ ಮಾಡಿದರು; ಅದಕ್ಕಾಗಿ ಇವರನ್ನು “ಆಧುನಿಕ ಮನೋವಿಜ್ಞಾನದ ಪಿತಾಮಹ” ಎನ್ನುವರು.",
"1890: ವಿಲಿಯಂ ಜೇಮ್ಸ್ “Principle of Psychology” ಪುಸ್ತಕ ಬರೆದರು.",
"1900: ಸಿಗ್ಮಂಡ್ ಫ್ರಾಯ್ಡ್ ಮನೋ ವಿಶ್ಲೇಷಣಾವಾದವನ್ನು ಮಂಡಿಸಿದರು.",
"1924: ವ್ಯಾಟ್ಸನ್ “ವರ್ತನಾವಾದ” (behaviorism) ಗ್ರಂಥವನ್ನು ಪ್ರಕಟಿಸಿದರು.",
"1951: ಮಾನವತಾವಾದಿ ಕಾರ್ಲ್ ರೋಜರ್ಸ್ “ಕಕ್ಷಿ ಕೇಂದ್ರಿತ ಚಿಕಿತ್ಸಾ ವಿಧಾನ” ಪ್ರಕಟಿಸಿದರು.",
"1953: B.F. ಸ್ಕಿನ್ನರ್ “ವಿಜ್ಞಾನ ಮತ್ತು ಮಾನವನ ವರ್ತನೆ” ಗ್ರಂಥ ಪ್ರಕಟಿಸಿದರು.",
"1954: ಅಲಹಾಬಾದ್ (U.P) ನಲ್ಲಿ ಬ್ಯೂರೋ ಆಫ್ ಸೈಕಾಲಜಿ ಸ್ಥಾಪಿಸಿದರು. 1955: ಬೆಂಗಳೂರಿನಲ್ಲಿ ನಿಮ್ಹಾನ್ಸ್ (NIMHANS) ಸ್ಥಾಪನೆ.",
"NOTE: ಆಧುನಿಕವಾಗಿ ಮನೋವಿಜ್ಞಾನದ ವಿಷಯ ಮತ್ತು “ವರ್ತನೆ”ಯಾಗಿದೆ; ಪ್ರಾಚೀನವಾಗಿ ವಿಷಯವಸ್ತು “ಆತ್ಮ”ವಾಗಿತ್ತು."],
add:"ಕಾಲಾನುಕ್ರಮ: 1879 → 1890 → 1900 → 1924 → 1951 → 1953 → 1954 → 1955."},
{id:"m3",t:"ಶಾಖೆಗಳು ಮತ್ತು ಶೈಕ್ಷಣಿಕ ಮನೋವಿಜ್ಞಾನ",p:"3–4",src:[
"1) ಶುದ್ಧ ಮನೋವಿಜ್ಞಾನ: ಸಾಮಾನ್ಯ, ಅಸಮಾನ್ಯ, ವಿಕಾಸಾತ್ಮಕ (ಸಂಕೇತ: ವಿಕಾಸ), ಸಾಮಾಜಿಕ, ಪ್ರಾಯೋಗಿಕ, ಅರಿವಿನ, ಭೌಗೋಳಿಕ.",
"2) ಅನ್ವಯಿಕ ಮನೋವಿಜ್ಞಾನ: ಚಿಕಿತ್ಸಕ, ಮಿಲಿಟರಿ, ಔದ್ಯೋಗಿಕ, ಅಪರಾಧ, ಶೈಕ್ಷಣಿಕ ಮನೋವಿಜ್ಞಾನ. (p3)",
"ಆಪ್ತ ಸಲಹೆ ಮನೋವಿಜ್ಞಾನ → “ಕಾರ್ಲ್ ರೋಜರ್ಸ್”; ಅನಿರ್ದೇಶಿತ ಸಲಹೆ (ಮಾರ್ಗದರ್ಶಕರಾಗಿರಬೇಕು). (p2)",
"ಶೈಕ್ಷಣಿಕ ಮನೋವಿಜ್ಞಾನ: ಸ್ಕಿನ್ನರ್: “ಬೋಧನೆ ಮತ್ತು ಕಲಿಕೆಗೆ ಸಂಬಂಧಿಸಿದ ಪ್ರಕ್ರಿಯೆ”. ಕ್ರೋ–ಕ್ರೋ: “ಹುಟ್ಟಿನಿಂದ ಮುಪ್ಪಿನವರೆಗೆ ಪಡೆಯುವ ಎಲ್ಲಾ ಅನುಭವಗಳೇ”. (p4)",
"ಪ್ರಾಚೀನ ಶೈಕ್ಷಣಿಕ ಮನೋವಿಜ್ಞಾನದ ಪಿತಾಮಹ → “ಪೆಸ್ಟಾಲಾಂಜಿ”; ಆಧುನಿಕ → “ಥಾರ್ನ್ ಡೈಕ್”. ಶೈಕ್ಷಣಿಕ ಮನೋವಿಜ್ಞಾನದ ವ್ಯಾಪ್ತಿ (3H ಸಿದ್ಧಾಂತ): a) ಕಲಿಕಾಕಾರ b) ಕಲಿಕಾನುಭವ c) ಕಲಿಕಾ ಪ್ರಕ್ರಿಯೆ d) ಕಲಿಕಾ ಸನ್ನಿವೇಶ e) ಶಿಕ್ಷಕ. (p4)"],
add:"ಶಾಖೆಗಳು ಎರಡು ವರ್ಗ: ಶುದ್ಧ (7 ಹೆಸರುಗಳು) ಮತ್ತು ಅನ್ವಯಿಕ (5 ಹೆಸರುಗಳು)."},
{id:"m4",t:"ಮನೋವಿಜ್ಞಾನದ ವಿಧಾನಗಳು",p:"4–6",src:[
"1) ಅವಲೋಕನ ವಿಧಾನ (Observation): “ವೀಕ್ಷಣಾ ವಿಧಾನ” ಎಂದೂ ಕರೆಯುವರು → ಜಾನ್.ಬಿ.ವ್ಯಾಟ್ಸನ್. ವಿಧಗಳು: a) ಸ್ವಾಭಾವಿಕ b) ನಿಯಂತ್ರಿತ c) ಗುಂಪಿನ ಜೊತೆ ಭಾಗವಹಿಸಿ (ಸಹ ಭಾಗಿತ್ವ) d) ಗುಂಪಿನ ಜೊತೆ ಭಾಗವಹಿಸದೇ. NOTE: ವ್ಯಕ್ತಿತ್ವ ಪರೀಕ್ಷೆಗೆ ತುಂಬ ಸಹಾಯಕಾರಿ. (p4)",
"2) ಅಂತರಾವಲೋಕನ (Introspection): ತನ್ನನ್ನು ತಾನು ಒಳ ಹೊಕ್ಕು ನೋಡಿಕೊಳ್ಳುವುದು → ಇ.ಬಿ. ಟಿಚ್ನರ್. Intro = within (ಒಳಗೆ), Spection = Looking (ನೋಡು). “ಸಿಂಹಾಲೋಕನ” ಎಂದೂ ಕರೆಯುವರು. ಇತಿಮಿತಿ: ಬುದ್ಧಿ ಮಾಂದ್ಯರು ಮತ್ತು ಭಾಷೆ ಬಾರದೇ ಇದ್ದವರು ಮಾಡಿಕೊಳ್ಳಲು ಸಾಧ್ಯವಿಲ್ಲ. ಪ್ರಾಮಾಣಿಕರಿಗೆ ಈ ವಿಧಾನ ಸೂಕ್ತ. (p4–5)",
"3) ಸಂದರ್ಶನ ವಿಧಾನ (Survey method) – ಸಮೀಕ್ಷಾ ವಿಧಾನ: i) ಸಂದರ್ಶನ ii) ಪ್ರಶ್ನಾವಳಿ iii) ಇತರೆ. (p5)",
"4) ವ್ಯಕ್ತಿ ಅಧ್ಯಯನ (Case study) → D.F.D. ಬುಕ್ಸ್ ಪ್ರತಿಪಾದಕರು. ಸಮಸ್ಯಾತ್ಮಕ ಮಗು, ಶೈಕ್ಷಣಿಕವಾಗಿ ಹಿಂದುಳಿದ ಮಗು, ಅತಿಸ್ತುನಿಂದ ಕೂಡಿದ ಮಗು, ಬಾಲಾಪರಾಧಿ ಮಗುವಿಗೆ ಬಳಸಬಹುದು. “ನೈದಾನಿಕ ವಿಧಾನ” (Diagnostic method) ಎನ್ನುವರು. (p5)",
"5) ಮನೋ ವಿಶ್ಲೇಷಣಾ ವಿಧಾನ (Psycho-Analysis) → ಸಿಗ್ಮಂಡ್ ಫ್ರಾಯ್ಡ್ (1900). ಪ್ರಜ್ಞಾವಸ್ಥೆಯಿಂದ ಅರೆಪ್ರಜ್ಞಾವಸ್ಥೆಗೆ ತಂದು ಅಧ್ಯಯನ ಮಾಡುವ ವಿಧಾನ. Ex: ಮಂಪರಿನ ಪರೀಕ್ಷೆ – ಅಪರಾಧಿಯ ಬಾಯಿಯಿಂದ ಸತ್ಯ ಹೊರ ತೆಗೆಯುವುದು; ಕನಸುಗಳ ವಿಶ್ಲೇಷಣೆ. (p6)",
"6) ಪ್ರಾಯೋಗಿಕ ವಿಧಾನ (Experimental): 1879 ಜರ್ಮನಿಯ ಲೀಪ್‌ಜಿಗ್ ವಿ.ವಿ.ಯಲ್ಲಿ ವಿಲ್‌ಹೆಲ್ಮ್ ವೂಂಟ್ ಮೊಟ್ಟ ಮೊದಲ ಬಾರಿಗೆ ಪ್ರಯೋಗ ಮಾಡಿದರು. ಇದರಿಂದ ಮನೋವಿಜ್ಞಾನಕ್ಕೆ ವಿಜ್ಞಾನದ ಸ್ಥಾನಮಾನ ದೊರೆಯಿತು. ವೈಜ್ಞಾನಿಕ, ವಸ್ತುನಿಷ್ಠ, ನಿಯಂತ್ರಿತ ವಿಧಾನ. (p6)"],
add:"ಸೂತ್ರ: ಅವಲೋಕನ–ವ್ಯಾಟ್ಸನ್; ಅಂತರಾವಲೋಕನ–ಟಿಚ್ನರ್; ವ್ಯಕ್ತಿ ಅಧ್ಯಯನ–D.F.D. ಬುಕ್ಸ್; ಮನೋವಿಶ್ಲೇಷಣೆ–ಫ್ರಾಯ್ಡ್; ಪ್ರಾಯೋಗಿಕ–ವೂಂಟ್."},
{id:"m5",t:"ಮನೋವಿಜ್ಞಾನದ ಪಂಥಗಳು",p:"7",src:[
"ರಚನಾತ್ಮಕ ಪಂಥ → ವೂಂಟ್, ಇ.ಬಿ. ಟಿಚ್ನರ್",
"ಕ್ರಿಯಾತ್ಮಕ ಪಂಥ → ವಿಲಿಯಂ ಜೇಮ್ಸ್, ಜಾನ್ ಡ್ಯೂಯಿ",
"ವರ್ತನಾ ಪಂಥ → ವ್ಯಾಟ್ಸನ್, ಸ್ಕಿನ್ನರ್, ಗುತ್ರಿ",
"ಮಾನವತಾವಾದಿ ಪಂಥ → ಅಬ್ರಹಾಂ ಮಾಸ್ಲೋ, ಕಾರ್ಲ್ ರೋಜರ್ (ಕಕ್ಷಿಕೇಂದ್ರಿತ ಸಿದ್ಧಾಂತ)",
"ಗೆಸ್ಟಾಲ್ಟ್ ಪಂಥ → ವರ್ತಿ ಮಿಯರ್, ಕೋಹ್ಲರ್, ಕರ್ಟ್ ಕಾಫ್ಕ",
"ವಿಶ್ಲೇಷಣಾತ್ಮಕ ಪಂಥ → ಕಾರ್ಲ್ ಯಂಗ್",
"ಮನೋವಿಶ್ಲೇಷಣಾ ಪಂಥ → ಸಿಗ್ಮಂಡ್ ಫ್ರಾಯ್ಡ್",
"ಜ್ಞಾನಾತ್ಮಕ ಪಂಥ → ಜೀನ್ ಪಿಯಾಜೆ, ವೈಗೋಟಸ್ಕ"],add:"ಪ್ರತಿ ಪಂಥಕ್ಕೆ ಒಂದು ಹೆಸರನ್ನು ಜೋಡಿಸಿ ನೆನಪಿಡಿ (ಉದಾ: ಗೆಸ್ಟಾಲ್ಟ್–ಕೋಹ್ಲರ್)."},
{id:"m6",t:"ಅನುವಂಶಿಯತೆ ಮತ್ತು ಪರಿಸರ",p:"8–9",src:[
"ಪೂರ್ವಜರಿಂದ ಬಳುವಳಿಯಾಗಿ ಪಡೆದುಕೊಂಡಿರುವ ಮಾನಸಿಕ & ದೈಹಿಕ ಲಕ್ಷಣಗಳೇ. ವಂಶವಾಹಿನಿಗಳನ್ನು ವರ್ಗಾವಣೆ ಮಾಡುವ ವಾಹಕಗಳಿಗೆ “ಗುಣಾಣುಗಳು/Genes”. ತಂದೆಯಿಂದ 50% ಮತ್ತು ತಾಯಿಯಿಂದ 50% ಗುಣಾಣುಗಳು ಮಗುವಿಗೆ ಬರುತ್ತವೆ. (p8)",
"ರೂಪಕ್ಕೆ (ಪ್ರತಿರೂಪ) ತತ್ವ: ತಂದೆ–ತಾಯಿಗಳ ಲಕ್ಷಣಗಳು ಮಕ್ಕಳಲ್ಲಿ ಇದ್ದರೆ. ಭಿನ್ನತೆಯ ತತ್ವ: ಭಿನ್ನವಾದ ಮಕ್ಕಳು ಹುಟ್ಟಿದರೆ. ತಂದೆ–ತಾಯಿ ಕೆಂಪಾಗಿದ್ದರೆ ಮಗು ಕಪ್ಪಾಗಿದ್ದರೆ ಕಾರಣ → ಅನುವಂಶಿಯತೆ ತಕ್ಷಣದ ಬದಲಾವಣೆ (mutation). ಸಮಶ್ರಯಣ: ಮಗು ತಂದೆಯ & ತಾಯಿಯ ಎರಡೂ ಲಕ್ಷಣಗಳನ್ನು ಕೂಡಿಸಿಕೊಂಡು ಬೆಳೆದರೆ. (p8)",
"ಪ್ರಯೋಗಗಳು: ಫ್ರೀಮನ್, ನ್ಯೂಮನ್ & ಹೋಲ್ಜಿಂಜರ್ – ಅವಳಿಗಳ ಬುದ್ಧಿಶಕ್ತಿಯ ಮೇಲೆ (ಸಯಾಮಿ, ಭ್ರಾತೃ, ಏಕರೂಪ). ಫ್ರಾನ್ಸಿಸ್ ಗಾಲ್ಟನ್ – “Herditry Genes” ಪುಸ್ತಕ. ಅಮೆರಿಕದ ಸಂಸ್ಥೆ – (2500) ಪ್ರೌಢಶಾಲಾ ಮಕ್ಕಳ ಮೇಲೆ ಪ್ರಯೋಗ; 50% ಅನುವಂಶಿಯತೆ ಬುದ್ಧಿಶಕ್ತಿಯನ್ನು ಅವಲಂಬಿಸಿದೆ.",
"ಬಿ. ಎಸ್. ಬಕ್ಸ್: 80% ಅನುವಂಶಿಯತೆಯು ಪ್ರಭಾವ ಬೀರುತ್ತದೆ. ಕಾರ್ಲ್ ಪಿಯರ್ಸನ್: ಪರಿಸರಕ್ಕಿಂತ ಅನುವಂಶಿಯತೆ 7 ಪಟ್ಟು ಹೆಚ್ಚು ಪ್ರಭಾವಿಸುತ್ತದೆ. ಮ್ಯಾಕ್ ಡ್ಯೂಗಲ್ (ಸಂಪ್ರಯೋಜನ ವಾದದ) – ಜ್ಯೂಕ್ ಮನೆತನ. (p9)"],
add:"ಮೂಲದ ಸಂಖ್ಯೆಗಳು: 50%–50%, 2500, 80%, 7 ಪಟ್ಟು."},
{id:"m7",t:"ಬೆಳವಣಿಗೆ ಮತ್ತು ವಿಕಾಸ",p:"9–11",src:[
"ಬೆಳವಣಿಗೆ (Growth): ಸಂಕುಚಿತ ವ್ಯಾಪ್ತಿ; ಪರಿಮಾಣಾತ್ಮಕ (quantitative); ಬಾಹ್ಯವಾಗಿ ನೋಡಬಹುದು; ನಿರ್ದಿಷ್ಟ ಬದಲಾವಣೆ; ನಿಂತು ಹೋಗುತ್ತದೆ; ವಿಕಾಸದ ಒಂದು ಭಾಗವಾಗಿದೆ; ಕೋಶ ವಿಭಜನೆಯಿಂದ ಉಂಟಾಗುತ್ತದೆ; ತರಬೇತಿಯ ಅವಶ್ಯಕತೆ ಇಲ್ಲ. Ex: ಗಾತ್ರ, ಆಕಾರ, ಬಣ್ಣ, ತೂಕ, ಎತ್ತರ, ರಚನೆ. (p9, p10)",
"ವಿಕಾಸ (Development): ವಿಶಾಲ ವ್ಯಾಪ್ತಿ; ಗುಣಾತ್ಮಕ & ಪರಿಮಾಣಾತ್ಮಕ; ಬಾಹ್ಯ & ಆಂತರಿಕ ಬದಲಾವಣೆ; ಸಂಕೀರ್ಣ ಬದಲಾವಣೆ; ಜೀವನ ಪರ್ಯಂತ ಪ್ರಕ್ರಿಯೆ; ಬದಲಾವಣೆಯನ್ನು ಒಳಗೊಂಡು ಮುಂದುವರಿಯುತ್ತದೆ; ಅನುಭವದಿಂದ ಉಂಟಾಗುತ್ತದೆ; ತರಬೇತಿ ನೀಡಬೇಕು. Ex: ಆಲೋಚನೆ, ವಿಚಾರ, ಆಸಕ್ತಿ, ಚಿಂತನೆ, ಗ್ರಹಿಕೆ, ಸಾಮಾಜಿಕರಣ, ನಿರ್ಣಯ ಕೈಗೊಳ್ಳುವುದು. (p9, p11)",
"ವಿಕಾಸದ ಸಾರ್ವತ್ರಿಕ ತತ್ವಗಳು (ಭಾಗ): ಅನುವಂಶಿಯತೆ ಮತ್ತು ಪರಿಸರಗಳ ಫಲಿತ; ಸಾಮಾನ್ಯದಿಂದ ನಿರ್ದಿಷ್ಟದ ಕಡೆಗೆ; ಏಕಪಾರ್ಶ್ವದಿಂದ ದ್ವಿಪಾರ್ಶ್ವದ ಕಡೆಗೆ; i) ಸೆಫಲೋ–ಕಾಡಲ್ ಟ್ರೆಂಡ್: ಶಿರ ಪಾದಾಭಿಮುಖ ವಿನ್ಯಾಸ; ii) ಪ್ರಾಕ್ಸಿಮೋ–ಡಿಸ್ಟಲ್ ಟ್ರೆಂಡ್: ಕೇಂದ್ರ ಪರಿಧಿ ವಿನ್ಯಾಸ; ವೈಯಕ್ತಿಕ ಪ್ರಕ್ರಿಯೆ: ವಿಭಿನ್ನತೆಯ ತತ್ವ; ಬಹುಮುಖ, ಸಂಚಿತ, ಸೃಜನಾತ್ಮಕ ಪ್ರಕ್ರಿಯೆ. (p10)",
"ಪಕ್ವತೆ (Maturation): ಅಭ್ಯಾಸ & ಅನುಭವಳಿಲ್ಲದೇ ಜನ್ಮದತ್ತವಾಗಿ ಬಂದಿರುವ ಲಕ್ಷಣಗಳೇ ಪಕ್ವತೆ. ವಿಕಾಸವನ್ನು ಪ್ರಭಾವಿಸುವ “ಜೈವಿಕ ಅಂಶ”. (p11)",
"ಕಲಿಕೆ (Learning): “ವರ್ತನೆಯಲ್ಲಿರುವ ಮಾರ್ಪಾಡು”. ಮ್ಯಾಕ್ ಡೋಗಲ್: ಅಭ್ಯಾಸ, ಅನುಭವ ಗೆಟ್ಟಿ ದಲ್ಲಾಗುವ ಬದಲಾವಣೆ. “ಇದು ಹೆಚ್ಚು ಕಡಿಮೆ ಶಾಶ್ವತವಾದ ಬದಲಾವಣೆ”. Ex: ಈಜುವುದು, ಸೈಕಲ್ ಸವಾರಿ, ಓದು–ಬರಹ, ಕ್ರಿಕೆಟ್ ಆಡುವುದು. (p11)"],
add:"ವಿಕಾಸದ ಚಿತ್ರ (p11): ವಿಕಾಸ ಕೇಂದ್ರದಲ್ಲಿ – ಅನುಬಂಧ, ಬೆಳವಣಿಗೆ, ಕಲಿಕೆ, ಪಕ್ವತೆ, ತರಬೇತಿ."},
{id:"m8",t:"ಮಾನವ ವಿಕಾಸದ ಹಂತಗಳು",p:"12–18",src:[
"ಎಲಿಜಬೆತ್ ಹರ್ಲಾಕ್ ವರ್ಗೀಕರಣ (p12): ಪ್ರಸವ ಪೂರ್ವ ಹಂತ (Prenatal): ಗರ್ಭಧಾರಣೆಯಿಂದ ಜನನದವರೆಗೆ. ಶೈಶವ (Infancy): ಜನನದಿಂದ 2 ವಾರಗಳವರೆಗೆ (ಮೊದಲ 14 ದಿನಗಳು). ಹಸುಳೆತನ (Babyhood): 2 ವಾರದಿಂದ 2 ವರ್ಷದವರೆಗೆ. ಪೂರ್ವ ಬಾಲ್ಯ (Early Childhood): 2–6 ವರ್ಷ. ಉತ್ತರ ಬಾಲ್ಯ (Late Childhood): 6–12 ವರ್ಷ. ಲೈಂಗಿಕ ಪಕ್ವತೆಯ ಕಾಲ (Puberty): 12 ವರ್ಷದಿಂದ 13 ಅಥವಾ 14 ವರ್ಷಗಳವರೆಗೆ. ಪೂರ್ವ ತಾರೂಣ್ಯ (Early Adolescence / ಕಿಶೋರಾವಸ್ಥೆ): 14–16. ಉತ್ತರ ತಾರೂಣ್ಯ (Late Adolescence / ಯೌವನಾವಸ್ಥೆ): 16–19. ವಯಸ್ಕತನ (Early Adulthood): 19–40. ಮಧ್ಯ ವಯಸ್ಕತನ (Middle Age): 40–60. ವೃದ್ಧಾಪ್ಯ (Old Age): 60 ರಿಂದ ಸಾಯುವವರೆಗೆ.",
"ಅರ್ನೆಸ್ಟ್ ಜೋನ್ಸ್ (4 ಹಂತಗಳು, p13): ಶೈಶವಾವಸ್ಥೆ (0–2), ಬಾಲ್ಯಾವಸ್ಥೆ (2–12: ಪೂರ್ವ 2–6 ಹಸುಳೆತನ; ಉತ್ತರ 6–12), ತಾರುಣ್ಯಾವಸ್ಥೆ (12–19), ವಯಸ್ಕತನ (19 ವರ್ಷ ನಂತರ).",
"ಪೂರ್ವ ಬಾಲ್ಯಾವಸ್ಥೆ (2–6): ಅನ್ವೇಷಣಾ ಕಾಲ, ಕುತೂಹಲ ಕಾಲ, ಪ್ರಶ್ನಿಸುವ ಕಾಲ, ಕೂಟಪೂರ್ವ ಕಾಲ & ಅನುಕರಣ ಕಾಲ; “ಕೂಟ ಪೂರ್ವ ಕಾಲ” ಮತ್ತು “ಶಾಲಾ ಪೂರ್ವ ಕಾಲ” ಎಂದೂ ಕರೆಯುವರು. (p13–14)",
"ಉತ್ತರ ಬಾಲ್ಯಾವಸ್ಥೆ (6–12): ಶಾಲೆಗೆ ಪ್ರವೇಶ ಮಾಡುವುದರಿಂದ “ಶಾಲಾ ಹಂತ”; “ಕೂಟ ಯುಗ (Ganguak age)”; ಉತ್ತರ ಬಾಲ್ಯದ ಅಂತ್ಯದ ವೇಳೆಗೆ 28 ಶಾಶ್ವತ ಹಲ್ಲುಗಳು ಬಂದಿರುತ್ತವೆ. (p15–16)",
"ತಾರುಣ್ಯಾವಸ್ಥೆ / ಕಿಶೋರಾವಸ್ಥೆ (12–19): ಲ್ಯಾಟಿನ್ “Adoloscere” = “ಪರಿಪಕ್ವತೆಯೆಡೆಗೆ ಸಾಗು”. ಸ್ಟೇನ್ಲಿ ಹಾಲ್ (USA): “ಆತಂಕ, ಆವೇಶದ & ಉದ್ವೇಗದ ಕಾಲ”. “ಬೆಳೆವಣಿಗೆಯ ಬುಗ್ಗೆ”. Male – ಟೆಸ್ಟೋಸ್ಟೀರಾನ್; Female – ಈಸ್ಟ್ರೋಜನ್ ಮತ್ತು ಪ್ರೊಜೆಸ್ಟರಾನ್. ಜೀನ್ ಪಿಯಾಜೆಯ 4ನೇ ಹಂತ (ಔಪಚಾರಿಕ). (p16–17)",
"10 ಹಂತಗಳ ಸಾರಾಂಶ (p18): ಪ್ರಸವ ಪೂರ್ವ: ಗರ್ಭ–ಜನನ; ಶೈಶವ: ಜನನ–2 ವಾರ; ಶಿಶುತ್ವ: 2 ವಾರ–2 ವರ್ಷ; ಪೂರ್ವ ಬಾಲ್ಯ: 2–6 (ಶಾಲಾ ಪೂರ್ವ / ಅನ್ವೇಷಣಾ ಹಂತ); ಉತ್ತರ ಬಾಲ್ಯ: 6–12 (ಶಾಲಾ ಹಂತ); ಲೈಂಗಿಕ ಪಕ್ವತೆ: 13–14; ತಾರುಣ್ಯಾವಸ್ಥೆ: 13/14–18 (ಕಿಶೋರಾವಸ್ಥೆ); ವಯಸ್ಕತನ: 19–40; ಮಧ್ಯ ವಯಸ್ಸು: 40–60; ವೃದ್ಧಾಪ್ಯ: 60 ರ ಮೇಲೆ. ಜೀವನಾವಧಿಯ 10 ಹಂತಗಳು – ಎಲಿಜಬೆತ್ ಹರ್ಲಾಕ್; 4 ಹಂತಗಳು – ಅರ್ನೆಸ್ಟ್ ಜೋನ್ಸ್."],
add:"⚠ ಮೂಲದಲ್ಲಿ ಎರಡು ಕಡೆ ನೀಡಿದ ವಯೋಮಿತಿಗಳು ಭಿನ್ನ (Puberty 12–13/14 vs 13–14; ತಾರುಣ್ಯ 14–16, 16–19 vs 13/14–18). ತಿದ್ದಿಲ್ಲ; ಪರೀಕ್ಷೆಗೆ ನಿಮ್ಮ ಪಠ್ಯಕ್ರಮ ಪರಿಶೀಲಿಸಿ."}
];

R('m2',['ವೂಂಟ್ ಪ್ರಯೋಗಾಲಯ ಸ್ಥಾಪಿಸಿದ ಲೀಪ್‌ಜಿಗ್ ಯಾವ ದೇಶದಲ್ಲಿದೆ (ಮೂಲ)?~ಜರ್ಮನಿ~ಅಮೆರಿಕ~ಭಾರತ~ಫ್ರಾನ್ಸ್~0','ಬ್ಯೂರೋ ಆಫ್ ಸೈಕಾಲಜಿ ಎಲ್ಲಿ ಸ್ಥಾಪನೆಯಾಯಿತು?~ಅಲಹಾಬಾದ್ (U.P)~ಬೆಂಗಳೂರು~ಮೈಸೂರು~ದೆಹಲಿ~0','NIMHANS ಸ್ಥಾಪನೆಯಾದ ಸ್ಥಳ?~ಬೆಂಗಳೂರು~ಅಲಹಾಬಾದ್~ಲೀಪ್‌ಜಿಗ್~ಮುಂಬೈ~0','ಸರಿಯಾದ ಜೋಡಿ ಯಾವುದು?~1951 ರೋಜರ್ಸ್~1951 ಸ್ಕಿನ್ನರ್~1953 ವ್ಯಾಟ್ಸನ್~1900 ವೂಂಟ್~0','ವೂಂಟ್‌ರನ್ನು ‘ಆಧುನಿಕ ಮನೋವಿಜ್ಞಾನದ ಪಿತಾಮಹ’ ಎನ್ನಲು ಕಾರಣ?~ಪ್ರಯೋಗಾಲಯ ಸ್ಥಾಪನೆ~ವರ್ತನಾವಾದ~ಮಂಪರಿನ ಪರೀಕ್ಷೆ~NIMHANS~0','ಈ ಘಟನೆಗಳಲ್ಲಿ ಮೊದಲು ನಡೆದದ್ದು?~ಜೇಮ್ಸ್ ಪುಸ್ತಕ 1890~ಫ್ರಾಯ್ಡ್ 1900~ವ್ಯಾಟ್ಸನ್ 1924~NIMHANS 1955~0']);
R('m3',['ಭೌಗೋಳಿಕ ಮನೋವಿಜ್ಞಾನ ಯಾವ ವರ್ಗಕ್ಕೆ ಸೇರಿದೆ?~ಶುದ್ಧ~ಅನ್ವಯಿಕ~ಎರಡೂ ಅಲ್ಲ~ಶೈಕ್ಷಣಿಕ~0','ವಿಕಾಸಾತ್ಮಕ ಮನೋವಿಜ್ಞಾನದ ಸಂಕೇತ?~ವಿಕಾಸ~ವಿಜ್ಞಾನ~ವಿಶ್ಲೇಷಣೆ~ವಿಕಾರ~0','ಮೂಲದಲ್ಲಿ ಶುದ್ಧ ಮನೋವಿಜ್ಞಾನದ ಶಾಖೆಗಳ ಸಂಖ್ಯೆ?~7~5~6~8~0','ಮೂಲದಲ್ಲಿ ಅನ್ವಯಿಕ ಮನೋವಿಜ್ಞಾನದ ಶಾಖೆಗಳ ಸಂಖ್ಯೆ?~5~7~4~6~0','‘ಅನಿರ್ದೇಶಿತ ಸಲಹೆ’ ಯಾವುದಕ್ಕೆ ಸಂಬಂಧಿಸಿದೆ?~ಆಪ್ತ ಸಲಹೆ ಮನೋವಿಜ್ಞಾನ~ಅಪರಾಧ ಮನೋವಿಜ್ಞಾನ~ಮಿಲಿಟರಿ~ಔದ್ಯೋಗಿಕ~0','‘ಶೈಕ್ಷಣಿಕ ಮನೋವಿಜ್ಞಾನದ ತಾತ’ ಎನ್ನುವವರು?~ಪೆಸ್ಟಾಲಾಂಜಿ~ಥಾರ್ನ್ ಡೈಕ್~ಸ್ಕಿನ್ನರ್~ಕ್ರೋ–ಕ್ರೋ~0','ಕಲಿಕಾಕಾರನು ಯಾರ ಮಾರ್ಗದರ್ಶನದಲ್ಲಿ ಕಲಿಯಬೇಕು?~ಶಿಕ್ಷಕರ~ಸ್ನೇಹಿತರ~ಯಾರೂ ಅಲ್ಲ~ಪೋಷಕರ~0','ಶೈಕ್ಷಣಿಕ ಮನೋವಿಜ್ಞಾನದ ವ್ಯಾಪ್ತಿಯಲ್ಲಿ ಮೂಲ ಪಟ್ಟಿಯ ಅಂಶಗಳ ಸಂಖ್ಯೆ?~5~3~4~6~0']);
R('m4',['ಅವಲೋಕನ ವಿಧಾನದ ಇತಿಮಿತಿ ಯಾವುದು?~ಗಮನವಿಟ್ಟು ಮಾಡದಿದ್ದರೆ ಸಂಪೂರ್ಣ ಮಾಹಿತಿ ಸಿಗುವುದಿಲ್ಲ~ಪ್ರಯೋಗಾಲಯ ಬೇಕು~ಕನಸು ಬೇಕು~ಭಾಷೆ ಬೇಕು~0','ಅವಲೋಕನದಲ್ಲಿ ‘ವ್ಯಕ್ತಿ ನಿಷ್ಠ’ ಎನ್ನುವುದು ಯಾವುದರ ಇತಿಮಿತಿ?~ಅವಲೋಕನ ವಿಧಾನ~ಪ್ರಾಯೋಗಿಕ ವಿಧಾನ~ಸಮೀಕ್ಷೆ~ವ್ಯಕ್ತಿ ಅಧ್ಯಯನ~0','ಹತಾಶೆಗೆ ಒಳಗಾದಾಗ ಯಾವ ವಿಧಾನ ಮಾಡಿಕೊಳ್ಳಲು ಸಾಧ್ಯವಿಲ್ಲ?~ಅಂತರಾವಲೋಕನ~ಅವಲೋಕನ~ಸಮೀಕ್ಷೆ~ಮನೋ ವಿಶ್ಲೇಷಣೆ~0','ಅಂತರಾವಲೋಕನ ಯಾವುದಕ್ಕೆ ಸೂಕ್ತ?~ಸ್ವಯಂ ವಿಮರ್ಶೆ & ವ್ಯಕ್ತಿತ್ವ ಸುಧಾರಣೆ~ಅಪರಾಧ ಪತ್ತೆ~ಬಾಲಾಪರಾಧ~ಕನಸು ವಿಶ್ಲೇಷಣೆ~0','ಅಂತರಾವಲೋಕನದಲ್ಲಿ ಅಂತರಾಳದ ವಿಷಯಗಳನ್ನು ಹೇಗೆ ದಾಖಲಿಸಲು ಸಾಧ್ಯ?~ಯಥಾವತ್ತಾಗಿ ದಾಖಲಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ~ನಿಖರವಾಗಿ ಸಾಧ್ಯ~ಸುಲಭ~ಅಗತ್ಯವಿಲ್ಲ~0','Spection ಎಂದರೆ?~Looking (ನೋಡು)~within (ಒಳಗೆ)~ಅಧ್ಯಯನ~ವರ್ತನೆ~0','ಸಮೀಕ್ಷಾ ವಿಧಾನದ ಇನ್ನೊಂದು ಹೆಸರು?~ಸಂದರ್ಶನ ವಿಧಾನ~ನೈದಾನಿಕ ವಿಧಾನ~ವೀಕ್ಷಣಾ ವಿಧಾನ~ಪ್ರಾಯೋಗಿಕ ವಿಧಾನ~0','ವ್ಯಕ್ತಿ ಅಧ್ಯಯನದಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಯನ್ನು ಯಾವ ದೃಷ್ಟಿಯಿಂದ ಅಧ್ಯಯನ ಮಾಡುತ್ತಾರೆ?~ಸಾಮಾಜಿಕ, ಶೈಕ್ಷಣಿಕ, ಆರ್ಥಿಕ, ಸಂವೇಗಾತ್ಮಕ~ಕೇವಲ ದೈಹಿಕ~ಕೇವಲ ಭಾಷಾ~ಕೇವಲ ಆರ್ಥಿಕ~0','‘ಸಮಸ್ಯೆಗೆ ಪರಿಹಾರ / ಚಿಕಿತ್ಸಾ ವಿಧಾನ’ ಎನ್ನುವ ಇಂಗ್ಲಿಷ್ ಹೆಸರು?~Diagnostic method~Survey method~Observation~Introspection~0','ಮನೋ ವಿಶ್ಲೇಷಣಾ ವಿಧಾನದ ವರ್ಷ (ಮೂಲ)?~1900~1879~1924~1951~0','ಅವಲೋಕನ ವಿಧದಲ್ಲಿ ‘ಗುಂಪಿನ ಜೊತೆ ಭಾಗವಹಿಸಿ’ ಎಂದರೆ?~ಸಹ ಭಾಗಿತ್ವ~ನಿಯಂತ್ರಿತ~ಸ್ವಾಭಾವಿಕ~ಅಂತರ~0','ಸಮೀಕ್ಷಾ ವಿಧಾನದ ಚಿತ್ರದಲ್ಲಿ ವ್ಯಕ್ತಿ ಹೇಗೆ ಮಾಹಿತಿ ನೀಡುತ್ತಾನೆ?~ನೇರವಾಗಿ~ಪರೋಕ್ಷವಾಗಿ~ಕನಸಿನಲ್ಲಿ~ಮೌನವಾಗಿ~0']);
R('m5',['ಜೇಮ್ಸ್ ಮತ್ತು ಡ್ಯೂಯಿ ಯಾವ ಪಂಥ?~ಕ್ರಿಯಾತ್ಮಕ~ರಚನಾತ್ಮಕ~ವರ್ತನಾ~ಗೆಸ್ಟಾಲ್ಟ್~0','ಟಿಚ್ನರ್ ಯಾವ ಪಂಥ?~ರಚನಾತ್ಮಕ~ಕ್ರಿಯಾತ್ಮಕ~ಮಾನವತಾವಾದಿ~ಜ್ಞಾನಾತ್ಮಕ~0','ಸ್ಕಿನ್ನರ್ ಯಾವ ಪಂಥ?~ವರ್ತನಾ~ಗೆಸ್ಟಾಲ್ಟ್~ವಿಶ್ಲೇಷಣಾತ್ಮಕ~ರಚನಾತ್ಮಕ~0','ವರ್ತಿ ಮಿಯರ್ ಯಾವ ಪಂಥ?~ಗೆಸ್ಟಾಲ್ಟ್~ವರ್ತನಾ~ಕ್ರಿಯಾತ್ಮಕ~ಜ್ಞಾನಾತ್ಮಕ~0','ಜೀನ್ ಪಿಯಾಜೆ ಯಾವ ಪಂಥ?~ಜ್ಞಾನಾತ್ಮಕ~ವರ್ತನಾ~ಮಾನವತಾವಾದಿ~ರಚನಾತ್ಮಕ~0','ವರ್ತನಾ ಪಂಥದಲ್ಲಿ ಇಲ್ಲದವರು?~ಅಬ್ರಹಾಂ ಮಾಸ್ಲೋ~ವ್ಯಾಟ್ಸನ್~ಸ್ಕಿನ್ನರ್~ಗುತ್ರಿ~0']);
R('m6',['ಅನುವಂಶಿಯತೆ ಎಂದರೇನು?~ಪೂರ್ವಜರಿಂದ ಬಳುವಳಿಯಾಗಿ ಪಡೆದ ಮಾನಸಿಕ & ದೈಹಿಕ ಲಕ್ಷಣಗಳು~ಪರಿಸರದ ಪ್ರಭಾವ~ಕಲಿಕೆ~ಪಕ್ವತೆ~0','ತಾಯಿಯಿಂದ ಮಗುವಿಗೆ ಬರುವ ಗುಣಾಣುಗಳ ಪ್ರಮಾಣ?~50%~25%~75%~100%~0','ಮೆಡಿಕೊಜೆನೆಟಿಕಲ್ ಸಂಸ್ಥೆ ಯಾರ ಮೇಲೆ ಅಧ್ಯಯನ ಮಾಡಿತು?~ತದ್ರೂಪಿಗಳ ಮೇಲೆ~ಪ್ರಾಣಿಗಳ ಮೇಲೆ~ಶಿಕ್ಷಕರ ಮೇಲೆ~ವೃದ್ಧರ ಮೇಲೆ~0','ಅಮೆರಿಕದ ಸಂಸ್ಥೆ ಪ್ರಯೋಗ ಮಾಡಿದ ಪ್ರೌಢಶಾಲಾ ಮಕ್ಕಳ ಸಂಖ್ಯೆ?~2500~500~1000~5000~0','ಭಿನ್ನತೆಯ ತತ್ವ ಎಂದರೆ?~ಪೋಷಕರಿಗಿಂತ ಭಿನ್ನ ಲಕ್ಷಣದ ಮಕ್ಕಳು ಹುಟ್ಟುವುದು~ಒಂದೇ ಲಕ್ಷಣ~ಕಲಿಕೆ~ಪಕ್ವತೆ~0','ಗುಣಾಣುಗಳು ಏನನ್ನು ಸಾಗಿಸುತ್ತವೆ?~ವಂಶವಾಹಿನಿಗಳನ್ನು~ಕಲಿಕೆಯನ್ನು~ಅನುಭವವನ್ನು~ವರ್ತನೆಯನ್ನು~0','ಅನುವಂಶಿಯತೆ ತಕ್ಷಣದ ಬದಲಾವಣೆಯ ಇಂಗ್ಲಿಷ್ ಪದ?~mutation~maturation~learning~growth~0']);
R('m7',['ಬೆಳವಣಿಗೆ (Growth) ಎಂದರೆ?~ಪರಿಮಾಣಾತ್ಮಕ ಬದಲಾವಣೆ~ಕೇವಲ ಗುಣಾತ್ಮಕ~ಅನುಭವ~ಕಲಿಕೆ~0','ಬೆಳವಣಿಗೆಯನ್ನು ನಿಯಂತ್ರಿಸಲು ಮೂಲದ ಪ್ರಕಾರ?~ಸಾಧ್ಯವಿಲ್ಲ~ಸಾಧ್ಯ~ಸುಲಭ~ಉಲ್ಲೇಖವಿಲ್ಲ~0','ವಿಕಾಸವನ್ನು ನಿಯಂತ್ರಿಸಬಹುದೇ?~ಹೌದು~ಇಲ್ಲ~ಹೇಳಿಲ್ಲ~ಎಂದಿಗೂ ಇಲ್ಲ~0','ಬಾಹ್ಯವಾಗಿ ಕಣ್ಣಿಗೆ ಕಾಣುವುದಿಲ್ಲ ಎನ್ನುವುದು?~ವಿಕಾಸ~ಬೆಳವಣಿಗೆ~ತೂಕ~ಎತ್ತರ~0','ಬೆಳವಣಿಗೆ ವಿಕಾಸದ ____?~ಒಂದು ಭಾಗ~ಸಂಪೂರ್ಣ ರೂಪ~ವಿರುದ್ಧ~ಹೆಸರು~0','ವಿಕಾಸದ ವ್ಯಾಪ್ತಿ ಹೇಗಿದೆ?~ವಿಶಾಲ~ಸಂಕುಚಿತ~ಶೂನ್ಯ~ಇಲ್ಲ~0','ವಿಕಾಸದ ಬದಲಾವಣೆ ಹೇಗಿದೆ?~ಸಂಕೀರ್ಣ~ನಿರ್ದಿಷ್ಟ~ಸರಳ~ಇಲ್ಲ~0','ವಿಕಾಸ ಏಕಪಾರ್ಶ್ವದಿಂದ ಯಾವ ಕಡೆಗೆ ಸಾಗುತ್ತದೆ?~ದ್ವಿಪಾರ್ಶ್ವದ ಕಡೆಗೆ~ತ್ರಿಪಾರ್ಶ್ವ~ಹಿಂದಕ್ಕೆ~ನಿಲ್ಲುತ್ತದೆ~0','ವಿಕಾಸ ಸಾಮಾನ್ಯದಿಂದ ಯಾವ ಕಡೆಗೆ ಸಾಗುತ್ತದೆ?~ನಿರ್ದಿಷ್ಟದ ಕಡೆಗೆ~ಸಂಕೀರ್ಣಕ್ಕೆ~ಹಿಂದಕ್ಕೆ~ನಿಲ್ಲುವುದು~0','ವಿಭಿನ್ನತೆಯ ತತ್ವ ಯಾವ ಪ್ರಕ್ರಿಯೆ?~ವೈಯಕ್ತಿಕ ಪ್ರಕ್ರಿಯೆ~ಸಾಮೂಹಿಕ~ಬಾಹ್ಯ~ಕೃತಕ~0','ಪಕ್ವತೆ ಸಿದ್ಧತೆಯ ಕಡೆಗೆ ಕೊಂಡೊಯ್ಯುವ ____ ಬದಲಾವಣೆ?~ಆಂತರಿಕ~ಬಾಹ್ಯ~ತರಬೇತಿ~ಕಲಿಕೆ~0','ಕಲಿಕೆ ‘ಹೆಚ್ಚು ಕಡಿಮೆ’ ಎಂತಹ ಬದಲಾವಣೆ?~ಶಾಶ್ವತವಾದ~ತಾತ್ಕಾಲಿಕ~ಜನ್ಮದತ್ತ~ಜೈವಿಕ~0','ಕಲಿಕೆ ಯಾವುದರಲ್ಲಾಗುವ ಮಾರ್ಪಾಡು?~ಕಾರ್ಯನಿರ್ವಹಣೆಯಲ್ಲಿ~ಎತ್ತರದಲ್ಲಿ~ತೂಕದಲ್ಲಿ~ಕೋಶದಲ್ಲಿ~0','ಸೈಕಲ್ ಸವಾರಿ, ಓದು–ಬರಹ, ಕ್ರಿಕೆಟ್ ಆಡುವುದು ಯಾವುದರ ಉದಾಹರಣೆ?~ಕಲಿಕೆ~ಬೆಳವಣಿಗೆ~ಪಕ್ವತೆ~ಅನುವಂಶಿಯತೆ~0']);
R('m8',['ಹರ್ಲಾಕ್: ಪ್ರಸವ ಪೂರ್ವ ಹಂತದ ಅವಧಿ?~ಗರ್ಭಧಾರಣೆಯಿಂದ ಜನನದವರೆಗೆ~ಜನನದಿಂದ 2 ವಾರ~2–6 ವರ್ಷ~6–12 ವರ್ಷ~0','ಶೈಶವ (Infancy) ಹಂತ ಎಷ್ಟು ದಿನಗಳು?~14~7~30~21~0','Babyhood ಗೆ ಕನ್ನಡ ಹೆಸರು?~ಹಸುಳೆತನ~ಶೈಶವ~ಬಾಲ್ಯ~ತಾರುಣ್ಯ~0','Puberty ಗೆ ಕನ್ನಡ ಹೆಸರು?~ಲೈಂಗಿಕ ಪಕ್ವತೆಯ ಕಾಲ~ವೃದ್ಧಾಪ್ಯ~ಶೈಶವ~ವಯಸ್ಕತನ~0','Late Adolescence ಗೆ ಕನ್ನಡ ಹೆಸರು?~ಯೌವನಾವಸ್ಥೆ~ಕಿಶೋರಾವಸ್ಥೆ~ಬಾಲ್ಯ~ಶೈಶವ~0','ವೃದ್ಧಾಪ್ಯದ ಇಂಗ್ಲಿಷ್ ಪದ?~Old Age~Middle Age~Infancy~Puberty~0','ಜೋನ್ಸ್ ಪ್ರಕಾರ ಬಾಲ್ಯಾವಸ್ಥೆ?~2–12 ವರ್ಷ~0–2 ವರ್ಷ~12–19 ವರ್ಷ~19+ ವರ್ಷ~0','ಜೋನ್ಸ್ ಪ್ರಕಾರ ವಯಸ್ಕತನ ಯಾವಾಗ?~19 ವರ್ಷ ನಂತರ~12 ವರ್ಷ~40 ವರ್ಷ~60 ವರ್ಷ~0','ಜೋನ್ಸ್ ಪ್ರಕಾರ ಪೂರ್ವ ಬಾಲ್ಯಾವಸ್ಥೆ (ಹಸುಳೆತನ)?~2–6 ವರ್ಷ~0–2 ವರ್ಷ~6–12 ವರ್ಷ~12–19 ವರ್ಷ~0','ಪೂರ್ವ ಬಾಲ್ಯದಲ್ಲಿ ಮಗು ಏನು ಮಾಡುತ್ತದೆ?~ಹಲವಾರು ಪ್ರಶ್ನೆಗಳನ್ನು ಕೇಳುತ್ತದೆ~ಮಾತನಾಡುವುದಿಲ್ಲ~ಓದುತ್ತದೆ~ಉದ್ಯೋಗ ಮಾಡುತ್ತದೆ~0','ಪೂರ್ವ ಬಾಲ್ಯದ ಮಕ್ಕಳು ಯಾವುದರಲ್ಲಿ ಆಸಕ್ತಿ ತೋರುತ್ತಾರೆ?~ಮಾಯಾಲೋಕದ ಕಥೆಗಳಲ್ಲಿ~ರಾಜಕೀಯ~ಉದ್ಯೋಗ~ಗಣಿತ ಸೂತ್ರ~0','ಪೂರ್ವ ಬಾಲ್ಯದ ದೈಹಿಕ ಬೆಳವಣಿಗೆ ಹೇಗಿದೆ?~ನಿಧಾನಗತಿಯ~ತೀವ್ರ~ನಿಂತಿದೆ~ಇಲ್ಲ~0','ಪೂರ್ವ ಬಾಲ್ಯದಲ್ಲಿ ಯಾವ ಹಲ್ಲುಗಳು ಹೋಗಿ ಶಾಶ್ವತ ಹಲ್ಲುಗಳು ಬರುತ್ತವೆ?~ಹಾಲುಹಲ್ಲುಗಳು~ದವಡೆ ಹಲ್ಲು~ಕೋರೆಹಲ್ಲು ಮಾತ್ರ~ಯಾವುದೂ ಅಲ್ಲ~0','ಮಗುವಿನ ‘ಅಹಂ ಪ್ರವೃತ್ತಿ’ ಪೂರ್ವ ಬಾಲ್ಯದಲ್ಲಿ ಹೇಗಾಗುತ್ತದೆ?~ಕಡಿಮೆ ಆಗುತ್ತಾ ಹೋಗುತ್ತದೆ~ಹೆಚ್ಚುತ್ತದೆ~ಇಲ್ಲ~ಸ್ಥಿರ~0','ಉತ್ತರ ಬಾಲ್ಯದ ಬೆಳವಣಿಗೆ ಹೇಗಿರುತ್ತದೆ?~ನಿಧಾನವಾಗಿ ಹಾಗೂ ಏಕರೂಪವಾಗಿ~ತೀವ್ರವಾಗಿ~ನಿಲ್ಲುತ್ತದೆ~ಇಲ್ಲ~0','ಉತ್ತರ ಬಾಲ್ಯದಲ್ಲಿ ಬಾಲಕರಿಗಿಂತ ಎತ್ತರವಾಗಿ ಬೆಳೆಯುವವರು?~ಬಾಲಕಿಯರು~ಬಾಲಕರು~ಇಬ್ಬರೂ ಸಮಾನ~ಯಾರೂ ಅಲ್ಲ~0','ಕೂಟಯುಗದಲ್ಲಿ ಮಕ್ಕಳು ಸ್ನೇಹಿತರೊಂದಿಗೆ?~ಯಾವಾಗಲೂ ಸೇರುತ್ತಾರೆ~ಸೇರುವುದಿಲ್ಲ~ಹೆದರುತ್ತಾರೆ~ಏಕಾಂತ ಬಯಸುತ್ತಾರೆ~0','ಉತ್ತರ ಬಾಲ್ಯದಲ್ಲಿ ಯಾರನ್ನು ಅನುಕರಣೆ ಮಾಡುತ್ತಾರೆ?~ಶಾಲೆಯ ಶಿಕ್ಷಕರನ್ನು~ರಾಜಕಾರಣಿಗಳನ್ನು~ನಟರನ್ನು~ಯಾರನ್ನೂ ಅಲ್ಲ~0','ತಾರುಣ್ಯಾವಸ್ಥೆಗೆ ಇನ್ನೊಂದು ಹೆಸರು?~ಬೆಳೆವಣಿಗೆಯ ಬುಗ್ಗೆ~ಕೂಟ ಯುಗ~ಶಾಲಾ ಹಂತ~ಹಸುಳೆತನ~0','ತಾರುಣ್ಯದಲ್ಲಿ ಹಾರ್ಮೋನುಗಳ ಸ್ರವಿಕೆ?~ಪ್ರಾರಂಭವಾಗುತ್ತದೆ~ನಿಲ್ಲುತ್ತದೆ~ಇಲ್ಲ~ಕಡಿಮೆಯಾಗುತ್ತದೆ~0','ತಾರುಣ್ಯದಲ್ಲಿ ಮಕ್ಕಳಿಗೆ ಬೇಕಾದ ಶಿಕ್ಷಣ?~ಲೈಂಗಿಕ ಜೀವನ ಶಿಕ್ಷಣ (ಆರೋಗ್ಯ ಶಿಕ್ಷಣ)~ಕೇವಲ ಆಟ~ಉದ್ಯೋಗ ಶಿಕ್ಷಣ~ಯಾವುದೂ ಇಲ್ಲ~0','ತಾರುಣ್ಯದಲ್ಲಿ ತೀವ್ರಗತಿಯಲ್ಲಿ ಕಾರ್ಯನಿರ್ವಹಿಸುವವು?~ನಿರ್ನಾಳ ಗ್ರಂಥಿಗಳು~ಕಣ್ಣುಗಳು~ಹಲ್ಲುಗಳು~ಕೈಗಳು~0','ಜೀನ್ ಪಿಯಾಜೆಯ 4ನೇ (ಔಪಚಾರಿಕ) ಹಂತ ಯಾವ ಅವಸ್ಥೆಗೆ ಸಂಬಂಧಿಸಿದೆ?~ತಾರುಣ್ಯಾವಸ್ಥೆ~ಶೈಶವ~ವೃದ್ಧಾಪ್ಯ~ಹಸುಳೆತನ~0','ತಾರುಣ್ಯದಲ್ಲಿ ಭಾವನೆಗಳು ಹೇಗೆ?~ಅತಿರೇಕಕ್ಕೆ ಹೋಗುತ್ತವೆ~ಕಡಿಮೆ~ನಿಂತಿವೆ~ಇಲ್ಲ~0','ಭಾವನೆಗಳನ್ನು ಹದ್ದುಬಸ್ತಿನಲ್ಲಿಡಲು ತಾರುಣ್ಯದಲ್ಲಿ ಏನು ಮಾಡಬೇಕು?~ಆಟಗಳಲ್ಲಿ (Sports) ಭಾಗವಹಿಸುವಂತೆ~ಏಕಾಂತದಲ್ಲಿರುವಂತೆ~ಓದು ಮಾತ್ರ~ಟಿವಿ ನೋಡುವಂತೆ~0','ತಾರುಣ್ಯದಲ್ಲಿ ಹೆಚ್ಚಿನ ಕಾಲ ಯಾರೊಂದಿಗೆ ಕಳೆಯುತ್ತಾರೆ?~ಸಮಾನ ವಯಸ್ಕರೊಂದಿಗೆ~ಏಕಾಂತ~ವೃದ್ಧರೊಂದಿಗೆ~ಶಿಕ್ಷಕರೊಂದಿಗೆ ಮಾತ್ರ~0','ಸ್ಟೇನ್ಲಿ ಹಾಲ್ ಯಾವ ದೇಶದವರು (ಮೂಲ)?~USA~ಭಾರತ~ಜರ್ಮನಿ~ಫ್ರಾನ್ಸ್~0','10 ಹಂತಗಳ ಸಾರಾಂಶದಲ್ಲಿ ಲೈಂಗಿಕ ಪಕ್ವತೆ?~13–14 ವರ್ಷ~19–40 ವರ್ಷ~2–6 ವರ್ಷ~0–2 ವರ್ಷ~0','10 ಹಂತಗಳ ಸಾರಾಂಶದಲ್ಲಿ ಶಿಶುತ್ವ?~2 ವಾರ – 2 ವರ್ಷ~0–2 ವಾರ~2–6 ವರ್ಷ~6–12 ವರ್ಷ~0','ಉತ್ತರ ಬಾಲ್ಯಕ್ಕೆ ‘ಶಾಲಾ ಹಂತ’ ಎನ್ನಲು ಕಾರಣ?~ಶಾಲೆಗೆ ಪ್ರವೇಶ ಮಾಡುವುದು~ಹಲ್ಲುಗಳು~ಹಾರ್ಮೋನ್~ಆಟ~0']);
R('m1',['ಪ್ರಸ್ತುತವಾಗಿ ಮನೋವಿಜ್ಞಾನವು ಏನಾಗಿ ಬೆಳೆದು ನಿಂತಿದೆ?~ಸ್ವತಂತ್ರ ಶಾಖೆ~ತತ್ವಶಾಸ್ತ್ರದ ಭಾಗ~ಧರ್ಮದ ಭಾಗ~ಕಲೆಯ ಭಾಗ~0','Schizophrenia ಎಂಬ ಮನೋರೋಗ ಯಾವ ವರ್ಗದದ್ದು?~ಮನೋ ವಿಕೃತಿಗಳು~ಮನೋ ಬೇನೆಗಳು~ಮನೋ ದೈಹಿಕ ಬೇನೆಗಳು~ಅರಿವಿನ ವಿಜ್ಞಾನ~0','ಅರಿಸ್ಟಾಟಲ್ ಯಾವ ಅಧ್ಯಯನ ಪಟ್ಟಿಯಲ್ಲಿ ಬರುತ್ತಾರೆ?~ಆತ್ಮದ ಅಧ್ಯಯನ~ಮನಸ್ಸಿನ ಅಧ್ಯಯನ~ಪ್ರಜ್ಞಾನುಭವಗಳ ಅಧ್ಯಯನ~ವರ್ತನೆಯ ಅಧ್ಯಯನ~0','ವೂಂಟ್ ಯಾವ ಅಧ್ಯಯನ ಪಟ್ಟಿಯಲ್ಲಿ ಬರುತ್ತಾರೆ?~ಪ್ರಜ್ಞಾನುಭವಗಳ ಅಧ್ಯಯನ~ಆತ್ಮದ ಅಧ್ಯಯನ~ಮನಸ್ಸಿನ ಅಧ್ಯಯನ~ವರ್ತನೆಯ ಅಧ್ಯಯನ~0','ಮನೋವಿಜ್ಞಾನ ಪದವನ್ನು ಮೊದಲು ಬಳಸಿದ ವರ್ಷ (ಗೆಕ್ಲೆ)?~1590~1879~1908~1945~0']);
R('m2',['ಫ್ರಾಯ್ಡ್ ಮನೋ ವಿಶ್ಲೇಷಣಾವಾದ ಮಂಡಿಸಿದ ವರ್ಷ?~1900~1890~1924~1953~0','ವ್ಯಾಟ್ಸನ್ ‘ವರ್ತನಾವಾದ’ ಗ್ರಂಥ ಪ್ರಕಟಿಸಿದ ವರ್ಷ?~1924~1900~1951~1955~0','ಕಾರ್ಲ್ ರೋಜರ್ಸ್ ಚಿಕಿತ್ಸಾ ವಿಧಾನ ಪ್ರಕಟಿಸಿದ ವರ್ಷ?~1951~1953~1954~1900~0','B.F. ಸ್ಕಿನ್ನರ್ ಗ್ರಂಥ ಪ್ರಕಟಿಸಿದ ವರ್ಷ?~1953~1951~1924~1890~0','ವಿಲಿಯಂ ಜೇಮ್ಸ್ ‘Principle of Psychology’ ಬರೆದ ವರ್ಷ?~1890~1879~1900~1913~0']);
